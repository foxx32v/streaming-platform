apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: perepihotic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: perepihoticwatch/client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NEXT_PUBLIC_API_URL
          value: http://localhost:3000